# Schema for the synthetic flue-gas / condensate sheet in examples/.
# label = the shortest text that identifies the row: OCR may truncate the rest
# (the "Carbon Dioxide" row is found by "Carbon" alone).
quantities:
  - {code: T,   label: "Temperature",     unit: "°C",    min: -50, max: 600}
  - {code: P,   label: "Pressure",        unit: "barg",  min: -1,  max: 200}
  - {code: m,   label: "Mass Flow",       unit: "kg/h",  min: 0,   max: 1.0e+7}
  - {code: V,   label: "Volumetric Flow", unit: "m3/h",  min: 0,   max: 1.0e+6}
  - {code: rho, label: "Density",         unit: "kg/m3", min: 0,   max: 3000}
components:   # mass fractions; they must sum to 1
  - {code: w_N2,  label: "Nitrogen"}
  - {code: w_O2,  label: "Oxygen"}
  - {code: w_CO2, label: "Carbon"}
  - {code: w_H2O, label: "Water"}
checks:
  density:   {mass: m, volume: V, density: rho, rel_tol: 0.01}
  fractions: {abs_tol: 0.005}
stream_header: '\d{3,4}'
